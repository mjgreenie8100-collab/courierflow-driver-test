<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<title>Courier Flow Driver</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#17212b;--muted:#6c7783;--line:#d8e0e7;--blue:#1f6feb;--dark:#101820;--green:#168355}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
.app{max-width:560px;margin:auto;min-height:100vh;background:#f7f9fb;padding-bottom:74px}
header{position:sticky;top:0;z-index:5;background:var(--dark);color:#fff;padding:14px 16px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:900}.header-actions{display:flex;align-items:center;gap:8px}.sync{font-size:12px;color:#b9f2d1}.edit-toggle{border:1px solid #5d6975;background:#202d38;color:#fff;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:900}
main{padding:14px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:2px 0 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px}
.title{font-size:20px;font-weight:900}.ref,.muted{color:var(--muted);font-size:13px;margin-top:3px}
h3{font-size:14px;margin:0 0 5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,input,textarea{font:inherit}.action,.secondary{width:100%;min-height:54px;border-radius:12px;padding:12px 14px;font-weight:900}
.action{border:0;background:var(--blue);color:white}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}
.navbtn{height:100%;border:0;background:#fff;color:#64707b;font-size:12px;font-weight:900}.navbtn.active{color:var(--blue);background:#eef5ff}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:68px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:8;background:white}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#e7ecf1;font-size:10px;margin-left:3px}
.progress{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}.pill{font-size:11px;font-weight:800;padding:5px 8px;border-radius:99px;background:#e7ecf1;color:#5f6974}.pill.done{background:#e5f4ec;color:#176e48}.pill.active{background:#e8f1ff;color:#1658b3}
label{display:block;font-size:13px;font-weight:800;margin:12px 0 6px}input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:white;padding:12px;font-size:16px}
textarea{min-height:88px}.sigwrap{background:white;border:1px solid var(--line);border-radius:12px;padding:8px}.sighead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}
#sig{width:100%;height:190px;display:block;border:1px dashed #aeb8c2;border-radius:9px;background:#fff;touch-action:none}
.small{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-weight:800}.notice{border:1px solid #ead49c;background:#fff8e8;color:#6c592e;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:11px}
.success{border-color:#b8dfca;background:#e9f7f0;color:#176942}.hidden{display:none}.photo{min-height:84px;border:1px dashed #aeb8c2;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:13px;background:white}
.capture-review{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:12px}.capture-review img{display:block;width:100%;max-height:52vh;object-fit:contain;border-radius:10px;background:#111}.capture-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.capture-actions button{min-height:54px;border-radius:12px;font-weight:900}.capture-retake{border:1px solid #d7a5a5;background:#fff;color:#9b2f2f}.capture-send{border:0;background:var(--green);color:#fff}
.jobbundle{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}.jobbundle:last-of-type{border-bottom:0}.jobref{font-size:17px;font-weight:900;margin:4px 2px 10px}.jobstatus{display:inline-block;border-radius:99px;background:#e8f1ff;color:#1658b3;padding:4px 8px;font-size:11px;font-weight:900;margin-top:6px}.queue-empty{padding:18px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px;margin-bottom:12px}
.confirm-overlay{position:fixed;inset:0;z-index:50;background:rgba(8,14,20,.58);display:grid;place-items:center;padding:18px}.confirm-overlay.hidden{display:none}.confirm-box{width:min(420px,100%);background:#fff;border-radius:16px;padding:18px;border:1px solid var(--line)}.confirm-title{font-size:20px;font-weight:900;margin-bottom:7px}.confirm-message{color:var(--muted);line-height:1.4;margin-bottom:16px}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.confirm-actions button{min-height:54px;border-radius:12px;font-weight:900}.confirm-no{background:#fff;border:1px solid var(--line);color:var(--ink)}.confirm-yes{background:var(--blue);border:0;color:#fff}
.editbar.hidden{display:none!important}.editbar{position:sticky;top:58px;z-index:6;background:#fff7df;border-bottom:1px solid #ead49c;padding:8px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.editbar button{min-height:38px;border:1px solid #d7c17e;background:#fff;border-radius:8px;font-size:11px;font-weight:900;color:#5b4a1d;padding:5px}
.editbar .editdone{background:#1f6feb;color:#fff;border-color:#1f6feb}.editbar .editreset{color:#a13b3b}.edit-help{grid-column:1/-1;font-size:11px;color:#6b572c;text-align:center;padding:2px 4px}
body.editing main{padding-bottom:160px}.cfeditable{transition:outline .08s,opacity .08s}.editing .cfeditable{outline:1px dashed #95a1ad;outline-offset:2px;cursor:pointer}.editing .cfeditable.cfselected{outline:3px solid #7b57d1;outline-offset:3px}.editing .cfeditable.cfhidden{opacity:.28!important;display:block!important}.editing .cfeditable.cfprotected::after{content:"PROTECTED";float:right;font-size:9px;background:#fff1c2;color:#715b19;border-radius:5px;padding:2px 5px;margin:2px}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div class="brand">Courier Flow Driver</div><div class="header-actions"><div class="sync" id="sync">● Synced</div><button class="edit-toggle" id="editToggle">EDIT</button></div></div></header>
<div class="editbar hidden" id="editbar">
<button id="editPrev">◀ PREV</button><button id="editNext">NEXT ▶</button><button id="editUp">↑ MOVE</button><button id="editDown">↓ MOVE</button><button id="editNarrow">W−</button>
<button id="editWide">W+</button><button id="editShort">H−</button><button id="editTall">H+</button><button id="editTextMinus">TEXT−</button><button id="editTextPlus">TEXT+</button><button id="editRename">RENAME</button><button id="editHide">HIDE</button>
<button id="editReset" class="editreset">RESET ITEM</button><button id="editResetScreen" class="editreset">RESET SCREEN</button><button id="editDone" class="editdone">DONE</button>
<div class="edit-help" id="editHelp">Tap a block below to edit it. Changes save on this phone.</div>
</div>
<main id="main"></main>
<nav class="bottom">
<button class="navbtn" data-view="new">New Jobs <span class="badge" id="bn">1</span></button>
<button class="navbtn" data-view="onboard">On Board <span class="badge" id="bo">0</span></button>
<button class="navbtn" data-view="delivery">Deliveries <span class="badge" id="bd">0</span></button>
</nav>
<div class="confirm-overlay hidden" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle">Confirm action</div>
    <div class="confirm-message" id="confirmMessage"></div>
    <div class="confirm-actions">
      <button class="confirm-no" id="confirmNo">NO</button>
      <button class="confirm-yes" id="confirmYes">YES</button>
    </div>
  </div>
</div>
</div>
<script>
(()=> {
const M=document.getElementById('main');
const editbar=document.getElementById('editbar'),editToggle=document.getElementById('editToggle'),editHelp=document.getElementById('editHelp'),editPrev=document.getElementById('editPrev'),editNext=document.getElementById('editNext'),editUp=document.getElementById('editUp'),editDown=document.getElementById('editDown'),editNarrow=document.getElementById('editNarrow'),editWide=document.getElementById('editWide'),editShort=document.getElementById('editShort'),editTall=document.getElementById('editTall'),editTextMinus=document.getElementById('editTextMinus'),editTextPlus=document.getElementById('editTextPlus'),editRename=document.getElementById('editRename'),editHide=document.getElementById('editHide'),editReset=document.getElementById('editReset'),editResetScreen=document.getElementById('editResetScreen'),editDone=document.getElementById('editDone');
const bn=document.getElementById('bn'),bo=document.getElementById('bo'),bd=document.getElementById('bd');
const confirmOverlay=document.getElementById('confirmOverlay'),confirmTitle=document.getElementById('confirmTitle'),confirmMessage=document.getElementById('confirmMessage'),confirmNo=document.getElementById('confirmNo'),confirmYes=document.getElementById('confirmYes');
const K='cf_driver_multi_v1',EK='cf_driver_layout_edits_v1',PK='cf_driver_admin_pin_v1';

const TEST_JOBS=[
 {id:'CF-10427',service:'Sameday Dedicated',vehicle:'Small Van',collectionCompany:'ABC Logistics',collectionAddress:'12 High Street',collectionTown:'London EC1V 2NX',collectionContact:'John Smith',collectionPhone:'0207 000 0000',deliveryCompany:'XYZ Services',deliveryAddress:'44 New Street',deliveryTown:'Birmingham B2 4QA',deliveryContact:'Sarah Jones',deliveryPhone:'0121 000 0000',goods:'3 items',instructions:'Reception collection — reference 12345'},
 {id:'CF-10428',service:'Sameday Dedicated',vehicle:'Medium Van',collectionCompany:'Northstar Print',collectionAddress:'85 Camden Road',collectionTown:'London NW1 9HE',collectionContact:'Emma Lewis',collectionPhone:'0207 111 2200',deliveryCompany:'Terminal Cargo Services',deliveryAddress:'Cargo Point',deliveryTown:'Heathrow TW6 2GA',deliveryContact:'Mark Patel',deliveryPhone:'0208 222 3100',goods:'6 boxes',instructions:'Ask for Goods In on arrival'},
 {id:'CF-10429',service:'Urgent Documents',vehicle:'Car',collectionCompany:'City Legal Documents',collectionAddress:'20 Finsbury Square',collectionTown:'London EC2A 1DX',collectionContact:'Daniel Reed',collectionPhone:'0207 333 4400',deliveryCompany:'Reading Business Centre',deliveryAddress:'1 Station Road',deliveryTown:'Reading RG1 1LG',deliveryContact:'Lucy Adams',deliveryPhone:'0118 555 6600',goods:'1 document pouch',instructions:'Time-critical documents — hand directly to recipient'},
 {id:'CF-10430',service:'Sameday Dedicated',vehicle:'LWB Van',collectionCompany:'East End Events',collectionAddress:'145 Commercial Street',collectionTown:'London E1 6BJ',collectionContact:'Tom Baker',collectionPhone:'0207 777 8800',deliveryCompany:'South London Exhibitions',deliveryAddress:'18 Wellesley Road',deliveryTown:'Croydon CR0 2AD',deliveryContact:'Hannah Cole',deliveryPhone:'0208 888 9900',goods:'8 equipment cases',instructions:'Fragile event equipment — keep upright'}
];

function freshJob(t){return Object.assign({},t,{status:'new',cstep:0,dstep:0,pod:{name:'',date:'',time:'',notes:''},completedAt:''})}
function freshState(){return{view:'new',selected:null,jobs:TEST_JOBS.map(freshJob)}}
function load(){
 try{
  const x=JSON.parse(localStorage.getItem(K)||'null');
  if(x&&Array.isArray(x.jobs)&&x.jobs.length===TEST_JOBS.length)return x;
 }catch(e){}
 return freshState()
}
let s=load(),editMode=false,selectedBlock=null,L=loadLayout(),collectionPhotoFile=null,collectionPhotoUrl='',sigOK=false;

function save(){localStorage.setItem(K,JSON.stringify(s));badges()}
function job(id){return s.jobs.find(j=>j.id===id)}
function selectedJob(){return job(s.selected)}
function html(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function now(){const d=new Date(),p=n=>String(n).padStart(2,'0');return{date:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),time:p(d.getHours())+':'+p(d.getMinutes())}}
function sync(){const x=document.getElementById('sync');x.textContent='● Syncing';x.style.color='#ffd28a';setTimeout(()=>{x.textContent='● Synced';x.style.color=''},450)}
function nav(){alert('Navigation is a test placeholder. Google Maps/Waze will be connected in the production build.')}
let confirmAction=null;
function askConfirm(title,message,yesLabel,onYes){
 confirmTitle.textContent=title;
 confirmMessage.textContent=message;
 confirmYes.textContent=yesLabel||'YES';
 confirmAction=onYes;
 confirmOverlay.classList.remove('hidden');
 setTimeout(()=>confirmYes.focus(),0)
}
function closeConfirm(){confirmOverlay.classList.add('hidden');confirmAction=null}
confirmNo.onclick=closeConfirm;
confirmYes.onclick=()=>{const fn=confirmAction;closeConfirm();if(fn)fn()};
confirmOverlay.addEventListener('click',e=>{if(e.target===confirmOverlay)closeConfirm()});
function activeDeliveryJobs(){return s.jobs.filter(j=>j.status==='delivery'||j.status==='pod')}
function badges(){
 bn.textContent=s.jobs.filter(j=>j.status==='new').length;
 bo.textContent=activeDeliveryJobs().length;
 bd.textContent=activeDeliveryJobs().length;
 document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===s.view||(b.dataset.view==='delivery'&&['deliveryDetail','pod','complete'].includes(s.view))))
}
function setView(v){s.view=v;s.selected=null;save();render()}

function render(){
 badges();
 const routes={new:newJobs,collection:collection,onboard:onboard,delivery:deliveryList,deliveryDetail:deliveryDetail,pod:pod,complete:completeScreen};
 (routes[s.view]||newJobs)();
 setTimeout(decorate,0)
}

function newJobs(){
 const waiting=s.jobs.filter(j=>j.status==='new'),active=s.jobs.filter(j=>j.status==='collection');
 let out='<div class="eyebrow">New Jobs</div>';
 if(active.length){
  out+='<div class="notice"><strong>'+active.length+' active collection'+(active.length>1?'s':'')+'.</strong> You can return to any of them below.</div>';
  active.forEach(j=>{
   out+='<div class="jobbundle"><div class="jobref">'+j.id+' <span class="jobstatus">COLLECTION IN PROGRESS</span></div><div class="card"><h3>Collection</h3>'+html(j.collectionCompany)+'<br>'+html(j.collectionAddress)+'<br>'+html(j.collectionTown)+'</div><button class="secondary openCollection" data-id="'+j.id+'">OPEN COLLECTION</button></div>'
  })
 }
 if(!waiting.length&&!active.length)out+='<div class="queue-empty">No new or active collection jobs.</div>';
 waiting.forEach(j=>{
  out+='<div class="jobbundle"><div class="jobref">'+j.id+'</div><div class="card"><h3>Service / Vehicle</h3><div class="muted">'+html(j.service)+' • '+html(j.vehicle)+'</div></div><div class="card"><h3>Collection</h3>'+html(j.collectionCompany)+'<br>'+html(j.collectionAddress)+'<br>'+html(j.collectionTown)+'<div class="muted">Ready: Now</div></div><div class="card"><h3>Delivery</h3>'+html(j.deliveryCompany)+'<br>'+html(j.deliveryAddress)+'<br>'+html(j.deliveryTown)+'</div><div class="card"><h3>Special Instructions</h3><div class="muted">'+html(j.instructions)+'</div></div><button class="action startJob" data-id="'+j.id+'">START JOB</button></div>'
 });
 out+='<button class="secondary" id="resetAll">Reset all 4 test bookings</button>';
 M.innerHTML=out;
 document.querySelectorAll('.startJob').forEach(b=>b.onclick=()=>startJob(b.dataset.id));
 document.querySelectorAll('.openCollection').forEach(b=>b.onclick=()=>openCollection(b.dataset.id));
 resetAll.onclick=()=>{if(confirm('Reset all four test bookings?')){localStorage.removeItem(K);s=freshState();clearCollectionPhoto();render()}}
}
function startJob(id){
 const j=job(id);
 askConfirm('Start job?','Confirm START JOB for '+j.id+'.','YES — START',()=>{
  j.status='collection';j.cstep=0;s.selected=id;s.view='collection';save();sync();render()
 })
}
function openCollection(id){s.selected=id;s.view='collection';save();render()}

function collection(){
 const j=selectedJob();if(!j||j.status!=='collection'){s.view='new';s.selected=null;save();return render()}
 const seq=['ENROUTE TO COLLECTION','ARRIVED AT COLLECTION','COLLECTED'],lab=seq[Math.min(j.cstep,2)];
 M.innerHTML='<div class="eyebrow">Collection</div><div class="progress"><span class="pill '+(j.cstep===0?'active':j.cstep>0?'done':'')+'">En route</span><span class="pill '+(j.cstep===1?'active':j.cstep>1?'done':'')+'">Arrived</span><span class="pill '+(j.cstep===2?'active':'')+'">Collected</span></div><div class="card"><div class="title">COLLECTION</div><div class="ref">Job '+j.id+'</div></div><div class="card"><h3>Collection Address</h3>'+html(j.collectionCompany)+'<br>'+html(j.collectionAddress)+'<br>'+html(j.collectionTown)+'</div><div class="card"><h3>Contact</h3><div class="muted">'+html(j.collectionContact)+' • '+html(j.collectionPhone)+'</div></div><div class="grid2"><div class="card"><h3>Goods</h3><div class="muted">'+html(j.goods)+'</div></div><button class="secondary" id="navBtn">NAVIGATE</button></div><button class="action" id="collectionAction">'+lab+'</button><div style="height:10px"></div><button class="secondary" id="backJobs">BACK TO JOBS</button>';
 navBtn.onclick=nav;
 backJobs.onclick=()=>setView('new');
 collectionAction.onclick=()=>{
 const labels=[
  {title:'En route to collection?',message:'Confirm you are now ENROUTE TO COLLECTION for '+j.id+'.',yes:'YES — ENROUTE'},
  {title:'Arrived at collection?',message:'Confirm you have ARRIVED AT COLLECTION for '+j.id+'.',yes:'YES — ARRIVED'},
  {title:'Goods collected?',message:'Confirm the goods have been COLLECTED for '+j.id+'. The camera will open next.',yes:'YES — COLLECTED'}
 ];
 const x=labels[Math.min(j.cstep,2)];
 askConfirm(x.title,x.message,x.yes,()=>{
  if(j.cstep<2){j.cstep++;save();sync();render()}else openCollectionCamera()
 })
}
}

function clearCollectionPhoto(){if(collectionPhotoUrl)URL.revokeObjectURL(collectionPhotoUrl);collectionPhotoUrl='';collectionPhotoFile=null}
function openCollectionCamera(){
 if(editMode)return;
 const input=document.createElement('input');
 input.type='file';input.accept='image/*';input.capture='environment';input.style.display='none';
 input.onchange=()=>{const file=input.files&&input.files[0];input.remove();if(!file)return;clearCollectionPhoto();collectionPhotoFile=file;collectionPhotoUrl=URL.createObjectURL(file);showCollectionPhotoReview()};
 document.body.appendChild(input);input.click()
}
function showCollectionPhotoReview(){
 const j=selectedJob();if(!j)return;
 if(!collectionPhotoFile||!collectionPhotoUrl){openCollectionCamera();return}
 M.innerHTML='<div class="eyebrow">Collection Photo</div><div class="notice"><strong>'+j.id+'</strong><br>Check the collection photo before continuing.</div><div class="capture-review"><img src="'+collectionPhotoUrl+'" alt="Collection photo preview"><div class="capture-actions"><button class="capture-retake" id="retake">✕ RETAKE</button><button class="capture-send" id="sendPhoto">✓ SEND</button></div></div>';
 retake.onclick=()=>{clearCollectionPhoto();openCollectionCamera()};
 sendPhoto.onclick=()=>{sendPhoto.disabled=true;sendPhoto.textContent='SENDING…';sync();setTimeout(()=>{j.status='delivery';j.dstep=0;s.view='deliveryDetail';save();clearCollectionPhoto();render()},350)}
}

function onboard(){
 const list=activeDeliveryJobs();
 let out='<div class="eyebrow">On Board</div>';
 if(!list.length)out+='<div class="queue-empty">No goods are currently on board.</div>';
 list.forEach(j=>{
  const status=j.status==='pod'?'POD IN PROGRESS':j.dstep===0?'EN ROUTE TO DELIVERY':'ARRIVED AT DELIVERY';
  out+='<div class="jobbundle"><div class="jobref">'+j.id+' <span class="jobstatus">'+status+'</span></div><div class="card"><h3>Delivery</h3>'+html(j.deliveryCompany)+'<br>'+html(j.deliveryAddress)+'<br>'+html(j.deliveryTown)+'<div class="muted">'+html(j.goods)+'</div></div><button class="secondary openDelivery" data-id="'+j.id+'">OPEN JOB</button></div>'
 });
 M.innerHTML=out;
 document.querySelectorAll('.openDelivery').forEach(b=>b.onclick=()=>openDelivery(b.dataset.id))
}

function deliveryList(){
 const list=activeDeliveryJobs();
 let out='<div class="eyebrow">Deliveries</div>';
 if(!list.length)out+='<div class="queue-empty">No active deliveries yet. Collect a job and send its collection photo to move it here.</div>';
 list.forEach(j=>{
  const status=j.status==='pod'?'POD IN PROGRESS':j.dstep===0?'EN ROUTE':'ARRIVED';
  out+='<div class="jobbundle"><div class="jobref">'+j.id+' <span class="jobstatus">'+status+'</span></div><div class="card"><h3>Delivery</h3>'+html(j.deliveryCompany)+'<br>'+html(j.deliveryAddress)+'<br>'+html(j.deliveryTown)+'</div><div class="card"><h3>Goods</h3><div class="muted">'+html(j.goods)+'</div></div><button class="action openDelivery" data-id="'+j.id+'">'+(j.status==='pod'?'OPEN POD':'OPEN DELIVERY')+'</button></div>'
 });
 M.innerHTML=out;
 document.querySelectorAll('.openDelivery').forEach(b=>b.onclick=()=>openDelivery(b.dataset.id))
}
function openDelivery(id){const j=job(id);s.selected=id;s.view=j.status==='pod'?'pod':'deliveryDetail';save();render()}

function deliveryDetail(){
 const j=selectedJob();if(!j||j.status!=='delivery'){s.view='delivery';s.selected=null;save();return render()}
 const lab=j.dstep===0?'ARRIVED AT DELIVERY':'POD';
 M.innerHTML='<div class="eyebrow">Deliveries</div><div class="progress"><span class="pill '+(j.dstep===0?'active':'done')+'">En route</span><span class="pill '+(j.dstep===1?'active':'')+'">Arrived</span><span class="pill">POD</span></div><div class="card"><div class="title">DELIVERY</div><div class="ref">Job '+j.id+'</div></div><div class="card"><h3>Delivery Address</h3>'+html(j.deliveryCompany)+'<br>'+html(j.deliveryAddress)+'<br>'+html(j.deliveryTown)+'</div><div class="card"><h3>Contact</h3><div class="muted">'+html(j.deliveryContact)+' • '+html(j.deliveryPhone)+'</div></div><div class="grid2"><div class="card"><h3>Goods to deliver</h3><div class="muted">'+html(j.goods)+'</div></div><button class="secondary" id="navBtn">NAVIGATE</button></div><button class="action" id="deliveryAction">'+lab+'</button><div style="height:10px"></div><button class="secondary" id="backDeliveries">BACK TO DELIVERIES</button>';
 navBtn.onclick=nav;
 backDeliveries.onclick=()=>setView('delivery');
 deliveryAction.onclick=()=>{
 if(j.dstep===0){
  askConfirm('Arrived at delivery?','Confirm you have ARRIVED AT DELIVERY for '+j.id+'.','YES — ARRIVED',()=>{
   j.dstep=1;save();sync();render()
  })
 }else{
  askConfirm('Open POD?','Confirm you are ready to complete POD for '+j.id+'.','YES — POD',()=>{
   j.status='pod';const n=now();j.pod.date=j.pod.date||n.date;j.pod.time=j.pod.time||n.time;s.view='pod';save();render()
  })
 }
}
}

function pod(){
 const j=selectedJob();if(!j||j.status!=='pod'){s.view='delivery';s.selected=null;save();return render()}
 const n=now();j.pod.date=j.pod.date||n.date;j.pod.time=j.pod.time||n.time;save();sigOK=false;
 M.innerHTML='<div class="eyebrow">POD</div><div class="ref" style="margin-bottom:10px">Job '+j.id+'</div><label>Recipient Name</label><input id="podName" value="'+html(j.pod.name)+'" placeholder="Enter recipient name"><div class="grid2"><div><label>POD Date</label><input id="podDate" type="date" value="'+html(j.pod.date)+'"></div><div><label>POD Time</label><input id="podTime" type="time" value="'+html(j.pod.time)+'"></div></div><label>Signature</label><div class="sigwrap"><div class="sighead"><span>Recipient signs on screen</span><button class="small" id="clearSig">Clear</button></div><canvas id="sig" width="720" height="380"></canvas></div><label>Delivery Notes</label><textarea id="podNotes" placeholder="Optional notes">'+html(j.pod.notes)+'</textarea><label>Delivery Photo</label><div class="photo">Delivery camera capture will be connected in the production build</div><div id="podWarn" class="notice hidden"></div><div style="height:12px"></div><button class="action" id="completeDelivery">COMPLETE DELIVERY</button><div style="height:10px"></div><button class="secondary" id="backDeliveries">BACK TO DELIVERIES</button>';
 wireSig();
 podName.oninput=e=>{j.pod.name=e.target.value;save()};
 podDate.oninput=e=>{j.pod.date=e.target.value;save()};
 podTime.oninput=e=>{j.pod.time=e.target.value;save()};
 podNotes.oninput=e=>{j.pod.notes=e.target.value;save()};
 backDeliveries.onclick=()=>setView('delivery');
 completeDelivery.onclick=()=>{
  if(!j.pod.name.trim()){podWarn.textContent='Enter the recipient name before completing POD.';podWarn.classList.remove('hidden');return}
  if(!sigOK){podWarn.textContent='Please obtain a recipient signature.';podWarn.classList.remove('hidden');return}
  askConfirm('Complete delivery?','Confirm delivery '+j.id+' is complete and the POD details are correct.','YES — COMPLETE',()=>{
   j.status='complete';j.completedAt=j.pod.date+' '+j.pod.time;s.view='complete';save();sync();render()
  })
 }
}
function wireSig(){
 const canvas=document.getElementById('sig'),ctx=canvas.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#111';let drawing=false;
 const p=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}};
 canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y)};
 canvas.onpointermove=e=>{if(!drawing)return;const q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke();sigOK=true};
 canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false;
 clearSig.onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);sigOK=false}
}
function completeScreen(){
 const j=selectedJob();if(!j||j.status!=='complete'){s.view='delivery';s.selected=null;save();return render()}
 M.innerHTML='<div class="eyebrow">Completed</div><div class="notice success"><strong>Job '+j.id+' completed.</strong><br>POD saved for '+html(j.pod.name)+' at '+html(j.pod.time)+' on '+html(j.pod.date)+'.</div><div class="card"><h3>Delivery</h3>'+html(j.deliveryCompany)+'<br>'+html(j.deliveryAddress)+'<br>'+html(j.deliveryTown)+'<div class="muted">POD complete</div></div><button class="action" id="backDeliveries">BACK TO DELIVERIES</button><div style="height:10px"></div><button class="secondary" id="backJobs">NEW JOBS</button>';
 backDeliveries.onclick=()=>setView('delivery');backJobs.onclick=()=>setView('new')
}

// Lightweight phone layout editor retained for test use.
function loadLayout(){try{return JSON.parse(localStorage.getItem(EK)||'{"items":{},"order":{}}')}catch(e){return{items:{},order:{}}}}
function saveLayout(){localStorage.setItem(EK,JSON.stringify(L))}
function screenKey(){return s.view+(s.selected?':'+s.selected:'')}
function baseKey(el,i){return screenKey()+':'+i}
function isProtected(el){return el.matches('button.action')||el.id==='completeDelivery'}
function textTarget(el){if(el.matches('button'))return el;return el.querySelector('.title,h3,.jobref')||null}
function decorate(){
 const els=[...M.children];els.forEach((el,i)=>{el.dataset.cfkey=baseKey(el,i);el.classList.add('cfeditable');el.classList.toggle('cfprotected',isProtected(el))});
 const order=L.order&&L.order[screenKey()];
 if(Array.isArray(order)&&order.length){const map=new Map([...M.children].map(x=>[x.dataset.cfkey,x]));order.forEach(k=>{const el=map.get(k);if(el)M.appendChild(el)})}
 [...M.children].forEach(el=>{const cfg=(L.items&&L.items[el.dataset.cfkey])||{};el.classList.remove('cfselected','cfhidden');if(cfg.width){el.style.width=cfg.width+'%';el.style.marginLeft='auto';el.style.marginRight='auto'}else{el.style.width='';el.style.marginLeft='';el.style.marginRight=''}el.style.minHeight=cfg.height?cfg.height+'px':'';const t=textTarget(el);if(t){if(cfg.label!==undefined)t.textContent=cfg.label;t.style.fontSize=cfg.font?cfg.font+'px':''}if(cfg.hidden){if(editMode){el.classList.add('cfhidden');el.style.display=''}else el.style.display='none'}else el.style.display=''});
 if(editMode&&selectedBlock){const live=[...M.children].find(x=>x.dataset.cfkey===selectedBlock);if(live){live.classList.add('cfselected');editHelp.textContent='Selected: '+((textTarget(live)?.textContent||live.textContent).trim().slice(0,40)||'block')}}
}
function cfgFor(el){L.items=L.items||{};return L.items[el.dataset.cfkey]||(L.items[el.dataset.cfkey]={})}
function selectableBlocks(){return [...M.children].filter(el=>el.dataset.cfkey&&!el.classList.contains('eyebrow'))}
function selectBlock(el){selectedBlock=el.dataset.cfkey;decorate()}
function selectRelative(dir){const list=selectableBlocks();if(!list.length)return;let i=list.findIndex(el=>el.dataset.cfkey===selectedBlock);if(i<0)i=0;else i=(i+dir+list.length)%list.length;selectedBlock=list[i].dataset.cfkey;decorate();list[i].scrollIntoView({behavior:'smooth',block:'center'})}
function selectedEl(){return [...M.children].find(x=>x.dataset.cfkey===selectedBlock)}
function changeSelected(fn){const el=selectedEl();if(!el)return alert('Tap a block first.');fn(el,cfgFor(el));saveLayout();decorate()}
function moveSelected(dir){const el=selectedEl();if(!el)return alert('Tap a block first.');const keys=[...M.children].map(x=>x.dataset.cfkey),i=keys.indexOf(selectedBlock),j=i+dir;if(j<0||j>=keys.length)return;[keys[i],keys[j]]=[keys[j],keys[i]];L.order=L.order||{};L.order[screenKey()]=keys;saveLayout();render()}
function enterEdit(){
 let pin=localStorage.getItem(PK);
 if(!pin){const a=prompt('Create a 4-digit TEST ADMIN PIN for editing on this phone:');if(!a||!/^[0-9]{4}$/.test(a))return alert('Please use exactly 4 digits.');const b=prompt('Confirm the 4-digit PIN:');if(a!==b)return alert('PINs did not match.');localStorage.setItem(PK,a);pin=a}else{const a=prompt('Enter TEST ADMIN PIN:');if(a!==pin)return alert('Incorrect PIN.')}
 editMode=true;selectedBlock=null;document.body.classList.add('editing');editbar.classList.remove('hidden');editToggle.textContent='EDITING';render();setTimeout(()=>{const first=selectableBlocks()[0];if(first){selectedBlock=first.dataset.cfkey;decorate()}},40)
}
function exitEdit(){editMode=false;selectedBlock=null;document.body.classList.remove('editing');editbar.classList.add('hidden');editToggle.textContent='EDIT';render()}
M.addEventListener('click',e=>{if(!editMode)return;const el=e.target.closest('[data-cfkey]');if(!el)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();selectBlock(el)},true);
editToggle.onclick=()=>editMode?exitEdit():enterEdit();editDone.onclick=exitEdit;editPrev.onclick=()=>selectRelative(-1);editNext.onclick=()=>selectRelative(1);editUp.onclick=()=>moveSelected(-1);editDown.onclick=()=>moveSelected(1);
editNarrow.onclick=()=>changeSelected((el,cfg)=>cfg.width=Math.max(50,(cfg.width||100)-10));editWide.onclick=()=>changeSelected((el,cfg)=>cfg.width=Math.min(100,(cfg.width||100)+10));editShort.onclick=()=>changeSelected((el,cfg)=>cfg.height=Math.max(36,(cfg.height||el.offsetHeight)-20));editTall.onclick=()=>changeSelected((el,cfg)=>cfg.height=(cfg.height||el.offsetHeight)+20);
editTextMinus.onclick=()=>changeSelected((el,cfg)=>{const t=textTarget(el);if(!t)return alert('This block has no editable heading.');cfg.font=Math.max(10,(cfg.font||parseFloat(getComputedStyle(t).fontSize))-2)});editTextPlus.onclick=()=>changeSelected((el,cfg)=>{const t=textTarget(el);if(!t)return alert('This block has no editable heading.');cfg.font=Math.min(36,(cfg.font||parseFloat(getComputedStyle(t).fontSize))+2)});
editRename.onclick=()=>changeSelected((el,cfg)=>{if(isProtected(el))return alert('Workflow button wording is protected in phone edit mode.');const t=textTarget(el);if(!t)return alert('This block has no editable label.');const v=prompt('New label:',cfg.label!==undefined?cfg.label:t.textContent);if(v!==null&&v.trim())cfg.label=v.trim()});
editHide.onclick=()=>changeSelected((el,cfg)=>{if(isProtected(el))return alert('Critical workflow buttons cannot be hidden.');cfg.hidden=!cfg.hidden});
editReset.onclick=()=>{const el=selectedEl();if(!el)return alert('Tap a block first.');delete L.items[el.dataset.cfkey];saveLayout();render()};
editResetScreen.onclick=()=>{if(!confirm('Reset all layout edits on this screen?'))return;const prefix=screenKey()+':';Object.keys(L.items||{}).filter(k=>k.startsWith(prefix)).forEach(k=>delete L.items[k]);if(L.order)delete L.order[screenKey()];saveLayout();selectedBlock=null;render()};

document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>setView(b.dataset.view));
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').then(r=>r.update()).catch(()=>{}));
render()
})();
</script>
</body></html>
